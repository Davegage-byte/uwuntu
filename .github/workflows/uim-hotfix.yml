name: UIM e2fsck Hotfix

on:
  push:
    branches:
      - fix/uim-e2fsck-exit1-20260915-1237

permissions:
  contents: write

jobs:
  patch-uim:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: fix/uim-e2fsck-exit1-20260915-1237
          fetch-depth: 0

      - name: Pflicht-Backup anlegen und prüfen
        shell: bash
        run: |
          set -Eeuo pipefail
          backup='backups/uwuntu-image-manager/Uwuntu Image Manager_backup-2026-09-15-12-37.sh'
          test ! -e "$backup"
          mkdir -p "$(dirname "$backup")"
          cp --preserve=mode,timestamps 'Uwuntu Image Manager.sh' "$backup"
          cmp -s 'Uwuntu Image Manager.sh' "$backup"

      - name: UIM 1.23 patchen
        shell: python
        run: |
          from pathlib import Path

          path = Path('Uwuntu Image Manager.sh')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('APP_VERSION="1.22"', 'APP_VERSION="1.23"'),
              ('APP_VERSION = "1.22"', 'APP_VERSION = "1.23"'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Versionsstelle unerwartet: {old!r} -> {count} Treffer')
              text = text.replace(old, new, 1)

          old = '    run(["e2fsck", "-fy", str(target)])\n    run(["resize2fs", "-M", str(target)])'
          new = '''    ext_check = run(["e2fsck", "-fy", str(target)], check=False)
    if ext_check.returncode not in (0, 1):
        raise RuntimeError(
            "Persistenz-Dateisystemprüfung vor dem Verkleinern "
            f"fehlgeschlagen (e2fsck Status {ext_check.returncode})."
        )
    run(["resize2fs", "-M", str(target)])'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'e2fsck-Stelle unerwartet: {count} Treffer')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/uim-hotfix.yml')
          workflow.unlink()

      - name: Syntax und Patch prüfen
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n 'Uwuntu Image Manager.sh'
          python3 - <<'PY'
          from pathlib import Path

          text = Path('Uwuntu Image Manager.sh').read_text(encoding='utf-8')
          for start, end, label in [
              ("<<'PYROOT'\n", "\nPYROOT\n", 'PYROOT'),
              ("<<'PYAPP'\n", "\nPYAPP\n", 'PYAPP'),
          ]:
              before, sep, rest = text.partition(start)
              if not sep:
                  raise SystemExit(f'{label}: Startmarker fehlt')
              code, sep, _ = rest.partition(end)
              if not sep:
                  raise SystemExit(f'{label}: Endmarker fehlt')
              compile(code, f'<{label}>', 'exec')
          PY
          git diff --check
          grep -Fq 'APP_VERSION="1.23"' 'Uwuntu Image Manager.sh'
          grep -Fq 'APP_VERSION = "1.23"' 'Uwuntu Image Manager.sh'
          grep -Fq 'ext_check = run(["e2fsck", "-fy", str(target)], check=False)' 'Uwuntu Image Manager.sh'
          grep -Fq 'if ext_check.returncode not in (0, 1):' 'Uwuntu Image Manager.sh'

      - name: Fix committen
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Davegage-byte'
          git config user.email '74912940+Davegage-byte@users.noreply.github.com'
          git add -A
          git commit -m 'IM1.22→IM1.23 · IMAGE · e2fsck-Status 1 beim Backup akzeptiert' \
            -m 'Uwuntu Image Manager v1.23

Beim Erstellen des kompakten Persistenz-Abbilds wird e2fsck -fy nun mit check=False ausgeführt. Die Rückgabewerte 0 (sauber) und 1 (Fehler erfolgreich korrigiert) werden als gültig akzeptiert; nur echte e2fsck-Fehler brechen das Backup weiterhin ab.

Zusätzlich wurden die zusammengehörigen Versionsstellen auf 1.23 angehoben und das vorgeschriebene unveränderte Backup des vorherigen Main-Stands angelegt. bash -n, beide Python-Heredocs und git diff --check werden vor dem Commit geprüft.'
          git push origin HEAD:fix/uim-e2fsck-exit1-20260915-1237

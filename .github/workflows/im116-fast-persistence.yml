name: IM1.16 Fast Persistence Restore

on:
  push:
    branches:
      - feature/im116-fast-persistence-restore

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: IM1.15 Pflicht-Backup anlegen
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(TZ=Europe/Berlin date +%Y-%m-%d-%H-%M)"
          mkdir -p backups/uwuntu-image-manager
          cp 'Uwuntu Image Manager.sh' "backups/uwuntu-image-manager/Uwuntu Image Manager_backup-${stamp}.sh"
          printf '%s\n' "BACKUP_PATH=backups/uwuntu-image-manager/Uwuntu Image Manager_backup-${stamp}.sh" >> "$GITHUB_ENV"

      - name: IM1.16 blockbasierten Persistenz-Restore einbauen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Uwuntu Image Manager.sh')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: erwartet 1 Treffer, gefunden {count}")
              text = text.replace(old, new, 1)

          def replace_between(start_marker, end_marker, new_block, label):
              global text
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{label}: Startmarker fehlt")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{label}: Endmarker fehlt")
              text = text[:start] + new_block + text[end:]

          replace_once('APP_VERSION="1.15"', 'APP_VERSION="1.16"', 'Shell-Version')
          replace_once('APP_VERSION = "1.15"', 'APP_VERSION = "1.16"', 'Root-Version')
          replace_once(
              'FORMAT_VERSION = "uwuntu-image-v2"\nSUPPORTED_FORMAT_VERSIONS = {"uwuntu-image-v1", FORMAT_VERSION}',
              'FORMAT_VERSION = "uwuntu-image-v3"\nSUPPORTED_FORMAT_VERSIONS = {"uwuntu-image-v1", "uwuntu-image-v2", FORMAT_VERSION}',
              'Format-Version',
          )
          replace_once('VERSION = "1.15"', 'VERSION = "1.16"', 'Frontend-Version')

          helper_marker = 'def stream_tar_to_zstd(mountpoint, target, estimate, progress):\n'
          helpers = r'''def ext_partclone_program(fstype):
              fstype = str(fstype or "").lower()
              if fstype == "ext3":
                  return "partclone.ext3"
              if fstype == "ext4":
                  return "partclone.ext4"
              raise RuntimeError(
                  f"Nicht unterstütztes Persistenz-Dateisystem: {fstype or 'unbekannt'}"
              )


          def ext_filesystem_size_bytes(path):
              info = output(
                  ["env", "LC_ALL=C", "dumpe2fs", "-h", str(path)],
                  timeout=30,
              )

              block_count = None
              block_size = None

              for line in info.splitlines():
                  if line.startswith("Block count:"):
                      block_count = int(line.split(":", 1)[1].strip())
                  elif line.startswith("Block size:"):
                      block_size = int(line.split(":", 1)[1].strip())

              if not block_count or not block_size:
                  raise RuntimeError(
                      "Größe des kompakten Persistenz-Dateisystems konnte "
                      "nicht ermittelt werden."
                  )

              return block_count * block_size


          def prepare_compact_ext_image(source, target, source_size, progress):
              target.unlink(missing_ok=True)

              # e2image -ra kopiert nur belegte ext-Blöcke in eine sparse Datei.
              # Der Master-Stick bleibt dabei vollständig unverändert.
              run(["e2image", "-rap", str(source), str(target)])
              progress.update(1, force=True)

              run(["e2fsck", "-fy", str(target)])
              run(["resize2fs", "-M", str(target)])
              minimum_size = ext_filesystem_size_bytes(target)
              progress.update(2, force=True)

              # Nach dem Minimieren wieder etwas freien Spielraum geben. Dadurch
              # ist das gespeicherte Dateisystem klein genug für unterschiedlich
              # große 32-GB-Sticks, aber nicht bis auf das letzte freie Blockpaar
              # zusammengeschoben.
              compact_size = min(
                  int(source_size),
                  math.ceil((minimum_size + 256 * MIB) / MIB) * MIB,
              )

              if compact_size < minimum_size:
                  raise RuntimeError(
                      "Kompaktes Persistenz-Dateisystem ist größer als die "
                      "Quellpartition."
                  )

              with open(target, "r+b") as handle:
                  handle.truncate(compact_size)

              run(["resize2fs", str(target)])
              run(["e2fsck", "-fy", str(target)])

              actual_size = ext_filesystem_size_bytes(target)
              if actual_size > compact_size:
                  raise RuntimeError(
                      "Das vorbereitete Persistenz-Dateisystem überschreitet "
                      "seine kompakte Zielgröße."
                  )

              progress.finish(3)
              return actual_size


          def stream_ext_partclone_to_zstd(
              source,
              target,
              total,
              progress,
              fstype,
          ):
              program = ext_partclone_program(fstype)
              log_handle = LOG_FILE.open("a", encoding="utf-8")
              partclone_proc = subprocess.Popen(
                  [program, "-c", "-s", str(source), "-o", "-", "-q"],
                  stdout=subprocess.PIPE,
                  stderr=log_handle,
              )
              zstd_proc = subprocess.Popen(
                  ["zstd", "-T0", "-3", "-q", "-o", str(target)],
                  stdin=subprocess.PIPE,
                  stdout=log_handle,
                  stderr=log_handle,
              )

              done = 0
              partclone_rc = None
              zstd_rc = None
              pipeline_error = None

              try:
                  while True:
                      chunk = partclone_proc.stdout.read(CHUNK)
                      if not chunk:
                          break

                      zstd_proc.stdin.write(chunk)
                      done += len(chunk)
                      progress.update(done)

                  zstd_proc.stdin.close()
                  partclone_rc = partclone_proc.wait()
                  zstd_rc = zstd_proc.wait()
              except Exception as exc:
                  pipeline_error = exc
                  try:
                      zstd_proc.stdin.close()
                  except Exception:
                      pass

                  for proc in (partclone_proc, zstd_proc):
                      try:
                          if proc.poll() is None:
                              proc.terminate()
                      except Exception:
                          pass

                  for proc in (partclone_proc, zstd_proc):
                      try:
                          proc.wait(timeout=5)
                      except Exception:
                          try:
                              proc.kill()
                          except Exception:
                              pass
              finally:
                  try:
                      partclone_proc.stdout.close()
                  except Exception:
                      pass
                  log_handle.close()

              if pipeline_error is not None:
                  raise RuntimeError(
                      f"Partclone-Persistenz-Backup fehlgeschlagen: {pipeline_error}"
                  ) from pipeline_error
              if partclone_rc != 0:
                  raise RuntimeError(
                      "Partclone-Sicherung der Persistenz ist fehlgeschlagen."
                  )
              if zstd_rc != 0:
                  raise RuntimeError(
                      "zstd-Komprimierung der Persistenz ist fehlgeschlagen."
                  )

              progress.finish(done)
              return done


          '''
          replace_once(helper_marker, helpers + helper_marker, 'Persistenz-Helfer')

          replace_once(
              '        "persistence.tar.zst",\n',
              '        "persistence.ext.partclone.zst",\n',
              'V3 Paketdatei',
          )

          backup_start = text.index('def backup(args):')
          backup_end = text.index('\n\n# ============================================================\n# Restore', backup_start)
          backup = text[backup_start:backup_end]

          old_phase = '''        # ----------------------------------------------------
                  # 2/4 Persistenz
                  # ----------------------------------------------------
                  run(
                      [
                          "mount",
                          "-t",
                          p2_info["fstype"],
                          "-o",
                          "ro,noload",
                          p2,
                          str(mount_dir),
                      ],
                      check=True,
                  )

                  try:
                      du = output(
                          ["du", "-sbx", "--apparent-size", str(mount_dir)],
                          timeout=120,
                      ).split()[0]
                      estimate = int(du)
                  except Exception:
                      try:
                          estimate = int(
                              output(
                                  ["df", "-B1", "--output=used", str(mount_dir)],
                                  timeout=10,
                              ).splitlines()[-1].strip()
                          )
                      except Exception:
                          estimate = max(1, p2_info["size_bytes"] // 2)

                  estimate = max(estimate + 64 * MIB, 128 * MIB)

                  persistence_zst = temp_dir / "persistence.tar.zst"

                  p = Progress(
                      "Persistenz sichern",
                      2,
                      4,
                      estimate,
                      "LESEN",
                  )

                  tar_stream_bytes = stream_tar_to_zstd(
                      mount_dir,
                      persistence_zst,
                      estimate,
                      p,
                  )

                  run(["umount", str(mount_dir)], check=True)
          '''.replace('          ', '')

          new_phase = '''        # ----------------------------------------------------
          # 2/5 Persistenz-Dateisystem kompakt vorbereiten
          # ----------------------------------------------------
          compact_ext = temp_dir / "persistence.compact.ext"

          p = Progress(
              "Persistenz für Schnell-Restore vorbereiten",
              2,
              5,
              3,
              "VORBEREITEN",
          )

          compact_size_bytes = prepare_compact_ext_image(
              p2,
              compact_ext,
              p2_info["size_bytes"],
              p,
          )

          # ----------------------------------------------------
          # 3/5 Persistenz blockweise sichern
          # ----------------------------------------------------
          persistence_zst = temp_dir / "persistence.ext.partclone.zst"

          p = Progress(
              "Persistenz blockweise sichern",
              3,
              5,
              compact_size_bytes,
              "LESEN",
          )

          persistence_stream_bytes = stream_ext_partclone_to_zstd(
              compact_ext,
              persistence_zst,
              compact_size_bytes,
              p,
              p2_info["fstype"],
          )

          compact_ext.unlink(missing_ok=True)

'''
          if old_phase not in backup:
              raise SystemExit('Backup Persistenzphase nicht gefunden')
          backup = backup.replace(old_phase, new_phase, 1)

          backup = backup.replace(
              '            1,\n            4,\n            p1_info["size_bytes"],',
              '            1,\n            5,\n            p1_info["size_bytes"],',
              1,
          )
          backup = backup.replace(
              '        # 3/4 Metadaten / Prüfsummen',
              '        # 4/5 Metadaten / Prüfsummen',
              1,
          )
          backup = backup.replace(
              '            "Image prüfen und vorbereiten",\n            3,\n            4,',
              '            "Image prüfen und vorbereiten",\n            4,\n            5,',
              1,
          )
          backup = backup.replace(
              '            "persistence.tar.zst": hash_file(persistence_zst),',
              '            "persistence.ext.partclone.zst": hash_file(persistence_zst),',
              1,
          )
          backup = backup.replace(
              '''            "partition2": {
                          **p2_info,
                          "backup": "persistence.tar.zst",
                          "tar_stream_bytes": tar_stream_bytes,
                      },'''.replace('          ', ''),
              '''            "partition2": {
                **p2_info,
                "backup": "persistence.ext.partclone.zst",
                "backup_method": f"partclone-{p2_info['fstype']}",
                "partclone_stream_bytes": persistence_stream_bytes,
                "compact_size_bytes": compact_size_bytes,
            },''',
              1,
          )
          backup = backup.replace(
              '        # 4/4 Einzelne .uwuntu-Datei',
              '        # 5/5 Einzelne .uwuntu-Datei',
              1,
          )
          backup = backup.replace(
              '            4,\n            4,\n            expected,',
              '            5,\n            5,\n            expected,',
              1,
          )
          if 'tar_stream_bytes' in backup:
              raise SystemExit('Backup enthält unerwartet noch tar_stream_bytes')

          text = text[:backup_start] + backup + text[backup_end:]

          restore_helper_marker = 'def restore(args):\n'
          restore_helper = r'''def restore_persistence_partclone_member(
              image,
              metadata,
              target,
              progress,
          ):
              p2_meta = metadata["partition2"]
              member_name = str(p2_meta.get("backup") or "")

              if member_name != "persistence.ext.partclone.zst":
                  raise RuntimeError(
                      "Partclone-Persistenz enthält einen unerwarteten Dateinamen."
                  )

              expected_stream = int(p2_meta.get("partclone_stream_bytes") or 0)
              if expected_stream <= 0:
                  raise RuntimeError("Partclone-Persistenz-Streamgröße fehlt im Image.")

              program = ext_partclone_program(p2_meta.get("fstype"))
              expected_method = f"partclone-{str(p2_meta.get('fstype') or '').lower()}"
              if p2_meta.get("backup_method") != expected_method:
                  raise RuntimeError(
                      "Partclone-Persistenz enthält keine gültige Backup-Methode."
                  )

              expected_hash = metadata["checksums"][member_name]
              zstd, thread, result, log_handle = feed_member_to_zstd(
                  image,
                  member_name,
                  expected_hash,
              )

              partclone_log = LOG_FILE.open("a", encoding="utf-8")
              partclone_proc = subprocess.Popen(
                  [program, "-r", "-s", "-", "-o", str(target), "-q"],
                  stdin=subprocess.PIPE,
                  stdout=partclone_log,
                  stderr=partclone_log,
              )

              done = 0
              zstd_rc = None
              partclone_rc = None
              pipeline_error = None

              try:
                  while True:
                      chunk = zstd.stdout.read(CHUNK)
                      if not chunk:
                          break

                      partclone_proc.stdin.write(chunk)
                      done += len(chunk)
                      progress.update(done)

                  partclone_proc.stdin.close()
                  zstd_rc = zstd.wait()
                  partclone_rc = partclone_proc.wait()
                  thread.join()
              except Exception as exc:
                  pipeline_error = exc
                  try:
                      partclone_proc.stdin.close()
                  except Exception:
                      pass

                  for proc in (zstd, partclone_proc):
                      try:
                          if proc.poll() is None:
                              proc.terminate()
                      except Exception:
                          pass

                  try:
                      thread.join(timeout=5)
                  except Exception:
                      pass
              finally:
                  log_handle.close()
                  partclone_log.close()

              if pipeline_error is not None:
                  if result.get("error"):
                      raise result["error"]
                  raise RuntimeError(
                      f"Partclone-Persistenz-Restore fehlgeschlagen: {pipeline_error}"
                  ) from pipeline_error
              if zstd_rc != 0:
                  raise RuntimeError(
                      "Partclone-Persistenz konnte nicht dekomprimiert werden."
                  )
              if partclone_rc != 0:
                  raise RuntimeError(
                      "Partclone-Wiederherstellung der Persistenz ist fehlgeschlagen."
                  )

              check_member_hash(result, expected_hash)

              if done != expected_stream:
                  raise RuntimeError(
                      "Partclone-Persistenz-Stream hat eine unerwartete Größe "
                      f"({done} statt {expected_stream} Bytes)."
                  )

              progress.finish(done)


          '''
          replace_once(restore_helper_marker, restore_helper + restore_helper_marker, 'Restore-Helfer')

          restore_start = text.index('def restore(args):')
          restore_end = text.index('\n\n# ============================================================\n# Ventoy Update', restore_start)
          restore = text[restore_start:restore_end]

          restore = restore.replace(
              '''    # Tatsächlich gespeicherte Nutzdaten der ext4-Seite.
              p2_used = int(
                  metadata["partition2"].get("tar_stream_bytes")
                  or metadata["partition2"].get("size_bytes")
                  or 0
              )'''.replace('      ', ''),
              '''    p2_meta = metadata["partition2"]

    if metadata.get("format") == "uwuntu-image-v3":
        p2_used = int(p2_meta.get("compact_size_bytes") or 0)
        if p2_used <= 0:
            raise RuntimeError("Kompakte Persistenzgröße fehlt im Image.")
    else:
        # V1/V2 bleiben mit dem bisherigen tar-Format kompatibel.
        p2_used = int(
            p2_meta.get("tar_stream_bytes")
            or p2_meta.get("size_bytes")
            or 0
        )''',
              1,
          )
          restore = restore.replace(
              'if metadata.get("format") == "uwuntu-image-v2":',
              'if metadata.get("format") in {"uwuntu-image-v2", "uwuntu-image-v3"}:',
          )

          persistence_start = restore.index('        # ----------------------------------------------------\n        # 3/4 Persistenz')
          persistence_end = restore.index('        # ----------------------------------------------------\n        # 4/4 Abschlussprüfung', persistence_start)
          new_persistence = '''        # ----------------------------------------------------
        # 3/4 Persistenz
        # ----------------------------------------------------
        p2_meta = metadata["partition2"]

        source_fs = str(p2_meta.get("fstype") or "").lower()
        if source_fs not in {"ext3", "ext4"}:
            raise RuntimeError(
                "Nicht unterstütztes Persistenz-Dateisystem im Image: "
                f"{source_fs or 'unbekannt'}"
            )

        if metadata.get("format") == "uwuntu-image-v3":
            persistence_total = int(
                p2_meta.get("partclone_stream_bytes") or 0
            )
            if persistence_total <= 0:
                raise RuntimeError(
                    "Partclone-Persistenz-Streamgröße fehlt im Image."
                )

            p = Progress(
                "Persistenz blockweise wiederherstellen",
                3,
                4,
                persistence_total,
                "SCHREIBEN",
            )

            restore_persistence_partclone_member(
                image,
                metadata,
                p2,
                p,
            )

            # Das im Image gespeicherte ext-Dateisystem ist absichtlich
            # kompakt. Nach dem schnellen Block-Restore wird es auf die
            # tatsächlich verfügbare Zielpartition erweitert.
            run(["e2fsck", "-fy", p2])
            run(["resize2fs", p2])
        else:
            mkfs_program = (
                "mkfs.ext3"
                if source_fs == "ext3"
                else "mkfs.ext4"
            )
            mkfs_args = [mkfs_program, "-F"]

            label = str(p2_meta.get("label") or "")
            uuid = str(p2_meta.get("uuid") or "")

            if label:
                mkfs_args += ["-L", label]

            if re.fullmatch(
                r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-"
                r"[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-"
                r"[0-9a-fA-F]{12}",
                uuid,
            ):
                mkfs_args += ["-U", uuid]

            mkfs_args.append(p2)

            run(mkfs_args)
            run(["mount", p2, str(mount_dir)])

            p = Progress(
                "Persistenz wiederherstellen",
                3,
                4,
                int(p2_meta["tar_stream_bytes"]),
                "SCHREIBEN",
            )

            restore_persistence_member(
                image,
                metadata,
                mount_dir,
                p,
            )

            run(["sync"], check=False)
            run(["umount", str(mount_dir)])

'''
          restore = restore[:persistence_start] + new_persistence + restore[persistence_end:]
          restore = restore.replace(
              '''        # Die Persistenz wurde gerade neu angelegt, beschrieben, synchronisiert
              # und sauber ausgehängt. Ohne -f überspringt e2fsck auf einem sauberen
              # Dateisystem den teuren erzwungenen Vollscan.'''.replace('      ', ''),
              '''        # Nach dem Restore ist nur noch eine normale Konsistenzprüfung
        # nötig. Ohne -f wird kein unnötiger Vollscan erzwungen.''',
              1,
          )

          text = text[:restore_start] + restore + text[restore_end:]

          ventoy_start = text.index('def ventoy_update(args):')
          ventoy_end = text.index('\n\n# ============================================================\n# Online-Update', ventoy_start)
          ventoy = text[ventoy_start:ventoy_end]

          ventoy = ventoy.replace(
              '    required = int(metadata["partition2"]["tar_stream_bytes"] * 1.05) + 256 * MIB',
              '''    p2_meta = metadata["partition2"]
    if metadata.get("format") == "uwuntu-image-v3":
        required = int(p2_meta.get("compact_size_bytes") or 0)
    else:
        required = int(p2_meta["tar_stream_bytes"] * 1.05) + 256 * MIB''',
              1,
          )
          ventoy = ventoy.replace(
              '    rollback_needed = False\n',
              '    rollback_needed = False\n    loopdev = ""\n',
              1,
          )

          mkfs_start = ventoy.index('        mkfs = ["mkfs.ext4", "-F", "-L", "casper-rw"]')
          mkfs_end = ventoy.index('        emit(\n            "progress",', mkfs_start)
          old_mkfs = ventoy[mkfs_start:mkfs_end]
          new_mkfs = '''        if metadata.get("format") != "uwuntu-image-v3":
            mkfs = ["mkfs.ext4", "-F", "-L", "casper-rw"]

            if re.fullmatch(
                r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-"
                r"[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-"
                r"[0-9a-fA-F]{12}",
                dat_uuid,
            ):
                mkfs += ["-U", dat_uuid]

            mkfs.append(str(new_file))
            run(mkfs)

'''
          ventoy = ventoy.replace(old_mkfs, new_mkfs, 1)

          phase2_start = ventoy.index('        # ----------------------------------------------------\n        # 2/3 Persistence hinein')
          phase2_end = ventoy.index('        # ----------------------------------------------------\n        # 3/3 Prüfen + atomar ersetzen', phase2_start)
          new_phase2 = '''        # ----------------------------------------------------
        # 2/3 Persistence hinein
        # ----------------------------------------------------
        if metadata.get("format") == "uwuntu-image-v3":
            persistence_total = int(
                p2_meta.get("partclone_stream_bytes") or 0
            )
            if persistence_total <= 0:
                raise RuntimeError(
                    "Partclone-Persistenz-Streamgröße fehlt im Image."
                )

            loopdev = output(
                ["losetup", "--find", "--show", str(new_file)],
                timeout=10,
            )

            p = Progress(
                "Uwuntu-Inhalt blockweise in Ventoy übertragen",
                2,
                3,
                persistence_total,
                "SCHREIBEN",
            )

            restore_persistence_partclone_member(
                image,
                metadata,
                loopdev,
                p,
            )

            run(["e2fsck", "-fy", loopdev])
            run(["resize2fs", loopdev])

            if re.fullmatch(
                r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-"
                r"[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-"
                r"[0-9a-fA-F]{12}",
                dat_uuid,
            ):
                run(["tune2fs", "-U", dat_uuid, loopdev])

            run(["e2label", loopdev, "casper-rw"])
            run(["e2fsck", "-p", loopdev], check=False)
            run(["losetup", "-d", loopdev], check=False)
            loopdev = ""
        else:
            loop_mount(new_file, mount_dir)

            p = Progress(
                "Uwuntu-Inhalt in Ventoy übertragen",
                2,
                3,
                int(p2_meta["tar_stream_bytes"]),
                "SCHREIBEN",
            )

            restore_persistence_member(
                image,
                metadata,
                mount_dir,
                p,
            )

            run(["sync"], check=False)
            run(["umount", str(mount_dir)])

        ext_check = run(["e2fsck", "-p", str(new_file)], check=False)
        if ext_check.returncode not in (0, 1):
            raise RuntimeError(
                "Neue Uwuntu.dat konnte nicht sauber geprüft werden."
            )

'''
          ventoy = ventoy[:phase2_start] + new_phase2 + ventoy[phase2_end:]
          ventoy = ventoy.replace(
              '''    finally:
                  try:
                      if subprocess.run('''.replace('      ', ''),
              '''    finally:
        if loopdev:
            try:
                run(["losetup", "-d", loopdev], check=False)
            except Exception:
                pass

        try:
            if subprocess.run(''',
              1,
          )

          text = text[:ventoy_start] + ventoy + text[ventoy_end:]

          replace_once(
              '''        if data.get("format") not in {
                      "uwuntu-image-v1",
                      "uwuntu-image-v2",
                  }:'''.replace('      ', ''),
              '''        if data.get("format") not in {
            "uwuntu-image-v1",
            "uwuntu-image-v2",
            "uwuntu-image-v3",
        }:''',
              'Frontend unterstützte Formate',
          )
          replace_once(
              '        f"Persistenzdaten: {fmt_bytes(p2.get(\'tar_stream_bytes\'))}\\n"',
              '        f"Persistenzdaten: {fmt_bytes(p2.get(\'partclone_stream_bytes\') or p2.get(\'tar_stream_bytes\'))}\\n"',
              'Image-Details Persistenz',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Pakete für echten Dateisystemtest installieren
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq partclone zstd e2fsprogs

      - name: Shell und eingebettetes Python prüfen
        shell: bash
        run: |
          set -euo pipefail
          bash -n 'Uwuntu Image Manager.sh'
          python3 - <<'PY'
          from pathlib import Path

          text = Path('Uwuntu Image Manager.sh').read_text(encoding='utf-8')
          for tag in ('PYROOT', 'PYAPP'):
              start_marker = f"<<'{tag}'\n"
              start = text.index(start_marker) + len(start_marker)
              end = text.index(f"\n{tag}\n", start)
              compile(text[start:end], f'<{tag}>', 'exec')

          assert text.count('APP_VERSION="1.16"') == 1
          assert text.count('APP_VERSION = "1.16"') == 1
          assert text.count('VERSION = "1.16"') == 1
          assert 'FORMAT_VERSION = "uwuntu-image-v3"' in text
          assert 'persistence.ext.partclone.zst' in text
          assert 'prepare_compact_ext_image' in text
          assert 'restore_persistence_partclone_member' in text
          assert '"uwuntu-image-v2", FORMAT_VERSION' in text
          assert 'show_total_time=True' in text
          PY
          cmp -s "$BACKUP_PATH" <(git show 7a0e443c0a8eb6b182ab58a1b475e316159197ef:'Uwuntu Image Manager.sh')
          git diff --check

      - name: Reale ext4 Kompakt-Partclone-Pipeline testen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/im116-test
          cd /tmp/im116-test

          dd if=/dev/urandom of=payload.bin bs=1M count=24 status=none
          printf 'Uwuntu IM1.16 persistence test\n' > marker.txt

          truncate -s 1024M source.ext4
          mkfs.ext4 -F -L casper-rw source.ext4 >/dev/null
          debugfs -w -R 'mkdir /data' source.ext4 >/dev/null 2>&1
          debugfs -w -R 'write payload.bin /data/payload.bin' source.ext4 >/dev/null 2>&1
          debugfs -w -R 'write marker.txt /data/marker.txt' source.ext4 >/dev/null 2>&1
          e2fsck -fy source.ext4 >/dev/null

          e2image -rap source.ext4 compact.ext4 >/dev/null 2>&1
          e2fsck -fy compact.ext4 >/dev/null
          resize2fs -M compact.ext4 >/dev/null

          block_count=$(LC_ALL=C dumpe2fs -h compact.ext4 2>/dev/null | awk -F: '/^Block count:/{gsub(/ /,"",$2);print $2}')
          block_size=$(LC_ALL=C dumpe2fs -h compact.ext4 2>/dev/null | awk -F: '/^Block size:/{gsub(/ /,"",$2);print $2}')
          min_bytes=$((block_count * block_size))
          compact_bytes=$(( ((min_bytes + 64*1024*1024 + 1024*1024 - 1) / (1024*1024)) * (1024*1024) ))
          truncate -s "$compact_bytes" compact.ext4
          resize2fs compact.ext4 >/dev/null
          e2fsck -fy compact.ext4 >/dev/null

          partclone.ext4 -c -s compact.ext4 -o - -q 2>/tmp/partclone-save.log | zstd -T0 -3 -q -o persistence.ext.partclone.zst

          truncate -s 1536M target.ext4
          loopdev=$(sudo losetup --find --show target.ext4)
          trap 'sudo losetup -d "$loopdev" >/dev/null 2>&1 || true' EXIT

          zstd -q -dc persistence.ext.partclone.zst | sudo partclone.ext4 -r -s - -o "$loopdev" -q 2>/tmp/partclone-restore.log
          sudo e2fsck -fy "$loopdev" >/dev/null
          sudo resize2fs "$loopdev" >/dev/null
          sudo e2fsck -p "$loopdev" >/dev/null || test $? -eq 1
          sudo losetup -d "$loopdev"
          trap - EXIT

          debugfs -R 'dump -p /data/payload.bin restored.bin' target.ext4 >/dev/null 2>&1
          debugfs -R 'dump -p /data/marker.txt restored-marker.txt' target.ext4 >/dev/null 2>&1
          cmp payload.bin restored.bin
          cmp marker.txt restored-marker.txt

          test "$(blkid -p -s LABEL -o value target.ext4)" = 'casper-rw'
          test "$(stat -c %s target.ext4)" -eq $((1536*1024*1024))

      - name: Finalen Branch-Commit erzeugen
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/im116-fast-persistence.yml
          git config user.name 'Davegage-byte'
          git config user.email '74912940+Davegage-byte@users.noreply.github.com'
          git add -A
          git commit -m 'IM1.15→IM1.16 · Persistenz-Restore blockbasiert beschleunigt' -m 'Uwuntu Image Manager v1.16

- neues Imageformat uwuntu-image-v3
- Boot-Partition bleibt beim schnellen Partclone-vfat-Pfad
- Persistenz wird beim Backup per e2image auf eine sichere kompakte ext-Abbildung vorbereitet
- kompakte Persistenz wird mit partclone.ext3/ext4 und zstd gespeichert
- Restore schreibt belegte ext-Blöcke statt tausende Dateien einzeln zu extrahieren
- Persistenz-Dateisystem wird nach Restore automatisch auf die Zielpartition erweitert
- unterschiedlich große 32-GB-Zielsticks bleiben durch das kompakte Dateisystem unterstützt
- alte v1/v2-Images bleiben restorefähig
- Ventoy-Update unterstützt v3 ebenfalls blockbasiert und behält die vorhandene Uwuntu.dat-UUID
- IM1.15-Gesamtdaueranzeige bleibt erhalten
- Pflicht-Backup des unveränderten IM1.15-Stands angelegt
- Syntax, Backup-Identität und reale ext4-Partclone-Restore-Pipeline getestet'
          git push origin HEAD:feature/im116-fast-persistence-restore

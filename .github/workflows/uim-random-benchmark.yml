name: UIM Random Benchmark

on:
  push:
    branches:
      - feature/uim-random-benchmark-20260922

permissions:
  contents: write

jobs:
  patch-uim:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: feature/uim-random-benchmark-20260922
          fetch-depth: 0

      - name: Pflicht-Backup anlegen und prüfen
        shell: bash
        run: |
          set -Eeuo pipefail
          backup='backups/uwuntu-image-manager/Uwuntu Image Manager_backup-2026-09-22-06-29.sh'
          test ! -e "$backup"
          mkdir -p "$(dirname "$backup")"
          cp --preserve=mode,timestamps 'Uwuntu Image Manager.sh' "$backup"
          cmp -s 'Uwuntu Image Manager.sh' "$backup"

      - name: UIM 1.24 mit 4K-Random-Benchmark erweitern
        shell: python
        run: |
          from pathlib import Path

          path = Path('Uwuntu Image Manager.sh')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: erwartet 1 Treffer, gefunden {count}')
              text = text.replace(old, new, 1)

          replace_once('APP_VERSION="1.23"', 'APP_VERSION="1.24"', 'Installer-Version')
          replace_once('APP_VERSION = "1.23"', 'APP_VERSION = "1.24"', 'Root-Version')
          replace_once('VERSION = "1.23"', 'VERSION = "1.24"', 'Frontend-Version')

          replace_once(
              '        e2fsprogs\n        parted',
              '        e2fsprogs\n        fio\n        parted',
              'fio-Abhängigkeit',
          )

          replace_once(
              'CHUNK = 4 * 1024 * 1024\n',
              'CHUNK = 4 * 1024 * 1024\n'
              'BENCHMARK_RANDOM_SECONDS = 8\n'
              'BENCHMARK_RANDOM_SIZE = 512 * MIB\n',
              'Benchmark-Konstanten',
          )

          marker = '''# ============================================================
          # USB-Benchmark
          # ============================================================

          def benchmark(args):
          '''
          helper = '''# ============================================================
          # USB-Benchmark
          # ============================================================

          def fio_random_benchmark(disk, rw, stage_index, direction):
              if rw not in {"randread", "randwrite"}:
                  raise RuntimeError(f"Ungültiger fio-Modus: {rw}")

              progress = Progress(
                  f"USB-Benchmark · 4K Random {direction.lower()}",
                  stage_index,
                  4,
                  BENCHMARK_RANDOM_SECONDS,
                  direction,
              )

              command = [
                  "fio",
                  f"--name=uwuntu-4k-{rw}",
                  f"--filename={disk}",
                  f"--rw={rw}",
                  "--bs=4k",
                  "--direct=1",
                  "--iodepth=1",
                  f"--runtime={BENCHMARK_RANDOM_SECONDS}",
                  "--time_based",
                  f"--size={BENCHMARK_RANDOM_SIZE}",
                  "--offset=0",
                  "--numjobs=1",
                  "--group_reporting",
                  "--randrepeat=0",
                  "--norandommap=1",
                  "--output-format=json",
                  "--eta=never",
              ]

              log("CMD: " + " ".join(command))
              started = time.monotonic()

              result = subprocess.run(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  timeout=BENCHMARK_RANDOM_SECONDS + 20,
              )

              elapsed = max(0.001, time.monotonic() - started)

              if result.returncode != 0:
                  detail = (result.stderr or result.stdout or "").strip()
                  raise RuntimeError(
                      f"fio 4K Random {direction.lower()} fehlgeschlagen "
                      f"({result.returncode})."
                      + (f"\\n{detail}" if detail else "")
                  )

              try:
                  payload = json.loads(result.stdout)
                  job = (payload.get("jobs") or [])[0]
                  stats = job["read" if rw == "randread" else "write"]
                  iops = float(stats.get("iops") or 0.0)
                  bw_bytes = float(stats.get("bw_bytes") or 0.0)
                  latency = stats.get("clat_ns") or stats.get("lat_ns") or {}
                  latency_ms = float(latency.get("mean") or 0.0) / 1_000_000
              except Exception as exc:
                  raise RuntimeError(
                      "fio-Ergebnis konnte nicht ausgewertet werden."
                  ) from exc

              if iops <= 0 or bw_bytes <= 0:
                  raise RuntimeError(
                      f"fio 4K Random {direction.lower()} lieferte "
                      "keine gültigen Leistungswerte."
                  )

              progress.finish(BENCHMARK_RANDOM_SECONDS)

              return {
                  "iops": iops,
                  "mbps": bw_bytes / 1_000_000,
                  "latency_ms": latency_ms,
                  "seconds": elapsed,
              }


          def benchmark(args):
          '''
          replace_once(marker, helper, 'fio-Helfer')

          replace_once(
              '''                f"USB-Benchmark: {info['model']} · {disk} · "
                          "512 MiB lesen/schreiben"''',
              '''                f"USB-Benchmark: {info['model']} · {disk} · "
                          "512 MiB sequenziell + 4K Random QD1"''',
              'Benchmark-Infotext',
          )

          replace_once(
              '''            1,
                      2,
                      total_bytes,''',
              '''            1,
                      4,
                      total_bytes,''',
              'Schreib-Stage',
          )
          replace_once(
              '''            2,
                      2,
                      total_bytes,''',
              '''            2,
                      4,
                      total_bytes,''',
              'Lese-Stage',
          )

          insertion = '''        read_seconds = max(0.001, time.monotonic() - read_started)
                  read_progress.finish(total_bytes)

                  write_mbps = total_bytes / write_seconds / 1_000_000
          '''
          replacement = '''        read_seconds = max(0.001, time.monotonic() - read_started)
                  read_progress.finish(total_bytes)

                  random_write = fio_random_benchmark(
                      disk,
                      "randwrite",
                      3,
                      "SCHREIBEN",
                  )

                  run(["sync"], check=False)
                  run(["blockdev", "--flushbufs", disk])

                  random_read = fio_random_benchmark(
                      disk,
                      "randread",
                      4,
                      "LESEN",
                  )

                  write_mbps = total_bytes / write_seconds / 1_000_000
          '''
          replace_once(insertion, replacement, 'Random-Benchmark-Aufruf')

          replace_once(
              '''        total_seconds = write_seconds + read_seconds

                  write_text = f"{write_mbps:.1f}".replace(".", ",")
                  read_text = f"{read_mbps:.1f}".replace(".", ",")
          ''',
              '''        total_seconds = (
                      write_seconds
                      + read_seconds
                      + random_write["seconds"]
                      + random_read["seconds"]
                  )

                  write_text = f"{write_mbps:.1f}".replace(".", ",")
                  read_text = f"{read_mbps:.1f}".replace(".", ",")
                  random_write_iops_text = f"{random_write['iops']:.0f}".replace(".", ",")
                  random_read_iops_text = f"{random_read['iops']:.0f}".replace(".", ",")
                  random_write_mbps_text = f"{random_write['mbps']:.1f}".replace(".", ",")
                  random_read_mbps_text = f"{random_read['mbps']:.1f}".replace(".", ",")
                  random_write_latency_text = (
                      f"{random_write['latency_ms']:.2f}".replace(".", ",")
                  )
                  random_read_latency_text = (
                      f"{random_read['latency_ms']:.2f}".replace(".", ",")
                  )
          ''',
              'Benchmark-Ergebnisformatierung',
          )

          replace_once(
              '''            f"read={read_mbps:.2f}MB/s; "
                      f"write_s={write_seconds:.2f}; read_s={read_seconds:.2f}"
          ''',
              '''            f"read={read_mbps:.2f}MB/s; "
                      f"randwrite={random_write['iops']:.2f}IOPS/"
                      f"{random_write['mbps']:.2f}MB/s; "
                      f"randread={random_read['iops']:.2f}IOPS/"
                      f"{random_read['mbps']:.2f}MB/s; "
                      f"write_s={write_seconds:.2f}; read_s={read_seconds:.2f}"
          ''',
              'Benchmark-Log',
          )

          replace_once(
              '''                f"Schreiben: {write_text} MB/s\\n"
                          f"Lesen: {read_text} MB/s\\n"
                          "Testmenge: 512 MiB\\n"
                          f"Schreibzeit: {write_time_text} s\\n"
                          f"Lesezeit: {read_time_text} s\\n"
                          f"Gesamt: {total_time_text} s\\n\\n"
          ''',
              '''                "SEQUENZIELL · 512 MiB\\n"
                          f"Schreiben: {write_text} MB/s\\n"
                          f"Lesen: {read_text} MB/s\\n"
                          f"Schreibzeit: {write_time_text} s\\n"
                          f"Lesezeit: {read_time_text} s\\n\\n"
                          "4K RANDOM · QD1 · DIRECT I/O\\n"
                          f"Schreiben: {random_write_iops_text} IOPS · "
                          f"{random_write_mbps_text} MB/s · "
                          f"{random_write_latency_text} ms\\n"
                          f"Lesen: {random_read_iops_text} IOPS · "
                          f"{random_read_mbps_text} MB/s · "
                          f"{random_read_latency_text} ms\\n"
                          f"Je Random-Test: {BENCHMARK_RANDOM_SECONDS} s\\n\\n"
                          f"Gesamt: {total_time_text} s\\n\\n"
          ''',
              'Benchmark-Ergebnisdialog',
          )

          replace_once(
              '''                "Misst die sequenzielle Schreib- und Lesegeschwindigkeit "
                          "mit jeweils 512 MiB. So lassen sich mehrere USB-Sticks "
                          "schnell miteinander vergleichen.",''',
              '''                "Misst zuerst die sequenzielle Schreib- und Lesegeschwindigkeit "
                          "mit jeweils 512 MiB und danach 4K-Random-Zugriffe mit QD1 "
                          "für Lesen und Schreiben. Die beiden Random-Tests dauern "
                          "jeweils nur 8 Sekunden.",''',
              'Frontend-Beschreibung',
          )

          replace_once(
              '''            "Test: 512 MiB schreiben → Cache leeren → 512 MiB lesen "
                      "und Daten prüfen. Ergebnis direkt in MB/s.",''',
              '''            "Test: 512 MiB sequenziell schreiben und verifizieren → "
                      "4K Random Write 8 s → Cache leeren → 4K Random Read 8 s. "
                      "Ergebnis: MB/s sowie Random-IOPS und Latenz.",''',
              'Frontend-Testhinweis',
          )

          replace_once(
              '''                        "USB-BENCHMARK · 512 MiB",''',
              '''                        "USB-BENCHMARK · SEQ + 4K RANDOM",''',
              'Frontend-Progress-Titel',
          )

          replace_once(
              '''  • benötigte Linux-Pakete
          ''',
              '''  • benötigte Linux-Pakete inkl. fio
          ''',
              'Installer-Text',
          )

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/uim-random-benchmark.yml').unlink()

      - name: Syntax und Änderung prüfen
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n 'Uwuntu Image Manager.sh'
          python3 - <<'PY'
          from pathlib import Path

          text = Path('Uwuntu Image Manager.sh').read_text(encoding='utf-8')

          for start, end, label in [
              ("<<'PYROOT'\n", "\nPYROOT\n", 'PYROOT'),
              ("<<'PYAPP'\n", "\nPYAPP\n", 'PYAPP'),
          ]:
              _, sep, rest = text.partition(start)
              if not sep:
                  raise SystemExit(f'{label}: Startmarker fehlt')
              code, sep, _ = rest.partition(end)
              if not sep:
                  raise SystemExit(f'{label}: Endmarker fehlt')
              compile(code, f'<{label}>', 'exec')

          required = [
              'APP_VERSION="1.24"',
              'APP_VERSION = "1.24"',
              'VERSION = "1.24"',
              'BENCHMARK_RANDOM_SECONDS = 8',
              '"fio",',
              '"--rw={rw}"',
              '"--bs=4k"',
              '"--direct=1"',
              '"--iodepth=1"',
              '"--time_based"',
              'random_write = fio_random_benchmark(',
              'random_read = fio_random_benchmark(',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Pflichtinhalt fehlt: {needle}')
          PY
          git diff --check
          cmp -s             <(git show 5ae44810a5bfb2186f8c71a64cd4eb96659bc41b:'Uwuntu Image Manager.sh')             'backups/uwuntu-image-manager/Uwuntu Image Manager_backup-2026-09-22-06-29.sh'

      - name: Änderung committen
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Davegage-byte'
          git config user.email '74912940+Davegage-byte@users.noreply.github.com'
          git add -A
          git commit -m 'IM1.23→IM1.24 · IMAGE · 4K-Random-Benchmark ergänzt' \
            -m 'Uwuntu Image Manager v1.24' \
            -m 'Der bestehende destruktive USB-Benchmark misst zusätzlich zur sequenziellen 512-MiB-Rate jetzt 4K-Random-Schreiben und 4K-Random-Lesen mit fio, Direct I/O und QD1. Jeder Random-Test läuft nur 8 Sekunden und bleibt auf die bereits vom Benchmark überschriebene erste 512-MiB-Region begrenzt.' \
            -m 'Die Ergebnisanzeige enthält Random-IOPS, MB/s und mittlere Latenz. fio wird als benötigtes Paket automatisch mitinstalliert. Der bestehende Schutz vor Systemdatenträgern und die Löschwarnung bleiben erhalten.' \
            -m 'Geprüft: bash -n, beide Python-Heredocs via compile(), git diff --check und Identität des Pflicht-Backups mit dem vorherigen Main-Stand.'
          git push origin HEAD:feature/uim-random-benchmark-20260922

name: IM1.16 Rawfile Restore Diagnose

on:
  push:
    branches:
      - feature/im116-fast-persistence-v2

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rawfile Restore testen
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq partclone zstd e2fsprogs
          partclone.ext4 --help 2>&1 | head -80 || true
          rm -rf /tmp/im116-raw
          mkdir -p /tmp/im116-raw
          cd /tmp/im116-raw
          dd if=/dev/urandom of=payload.bin bs=1M count=8 status=none
          truncate -s 512M source.ext4
          mkfs.ext4 -F -L casper-rw source.ext4 >/dev/null 2>&1
          debugfs -w -R 'mkdir /data' source.ext4 >/dev/null 2>&1
          debugfs -w -R 'write payload.bin /data/payload.bin' source.ext4 >/dev/null 2>&1
          e2fsck -fy source.ext4 >/dev/null
          partclone.ext4 -c -s source.ext4 -o clone.pcl -q 2>save.log
          set +e
          partclone.ext4 -r -s clone.pcl --restore_raw_file target.ext4 -q 2>restore.log
          rc=$?
          set -e
          echo "raw_restore_rc=$rc"
          cat restore.log || true
          ls -lh target.ext4 || true
          test "$rc" -eq 0
          e2fsck -fy target.ext4 >/dev/null
          debugfs -R 'dump -p /data/payload.bin restored.bin' target.ext4 >/dev/null 2>&1
          cmp payload.bin restored.bin
          test "$(blkid -p -s LABEL -o value target.ext4)" = 'casper-rw'

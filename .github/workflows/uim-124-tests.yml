name: UIM 1.24 Tests
on:
  push:
    branches:
      - feature/uim-random-benchmark-20260922

jobs:
  test-uim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell-Syntax
        run: bash -n 'Uwuntu Image Manager.sh'

      - name: Python-Heredocs kompilieren
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("Uwuntu Image Manager.sh").read_text(encoding="utf-8")
          for start, end, label in [
              ("<<'PYROOT'\n", "\nPYROOT\n", "PYROOT"),
              ("<<'PYAPP'\n", "\nPYAPP\n", "PYAPP"),
          ]:
              code = text.split(start, 1)[1].split(end, 1)[0]
              compile(code, label, "exec")
          PY

      - name: Patch und Backup prüfen
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check origin/main...HEAD
          cmp -s <(git show origin/main:'Uwuntu Image Manager.sh') 'backups/uwuntu-image-manager/Uwuntu Image Manager_backup-2026-09-22-06-29.sh'
          grep -Fq 'APP_VERSION="1.24"' 'Uwuntu Image Manager.sh'
          grep -Fq 'APP_VERSION = "1.24"' 'Uwuntu Image Manager.sh'
          grep -Fq 'VERSION = "1.24"' 'Uwuntu Image Manager.sh'
          grep -Fq 'BENCHMARK_RANDOM_SECONDS = 8' 'Uwuntu Image Manager.sh'
          grep -Fq '"--bs=4k"' 'Uwuntu Image Manager.sh'
          grep -Fq '"--direct=1"' 'Uwuntu Image Manager.sh'
          grep -Fq '"--iodepth=1"' 'Uwuntu Image Manager.sh'
          grep -Fq 'random_write = fio_random_benchmark(' 'Uwuntu Image Manager.sh'
          grep -Fq 'random_read = fio_random_benchmark(' 'Uwuntu Image Manager.sh'

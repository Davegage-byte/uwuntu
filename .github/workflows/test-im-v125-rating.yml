name: Test IM v1.25 Uwuntu rating

on:
  push:
    branches:
      - codex/im-v125-uwuntu-rating
    paths:
      - .github/workflows/test-im-v125-rating.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Image Manager prüfen
        shell: bash
        run: |
          set -Eeuo pipefail

          bash -n "Uwuntu Image Manager.sh"
          git diff --check 31ff2f030e1f5d005808aac60ffcfac9e7864d0c..HEAD

          cmp -s \
            <(git show 31ff2f030e1f5d005808aac60ffcfac9e7864d0c:"Uwuntu Image Manager.sh") \
            "backups/uwuntu-image-manager/Uwuntu Image Manager_backup-2026-09-22-07-24.sh"

          grep -q 'APP_VERSION="1.25"' "Uwuntu Image Manager.sh"
          grep -q 'APP_VERSION = "1.25"' "Uwuntu Image Manager.sh"
          grep -q 'VERSION = "1.25"' "Uwuntu Image Manager.sh"

          python3 - <<'PY'
          import ast
          from pathlib import Path

          text = Path("Uwuntu Image Manager.sh").read_text(encoding="utf-8")

          root_marker = "cat > \"$ROOT_HELPER\" <<'PYROOT'\n"
          root_code = text.split(root_marker, 1)[1].split("\nPYROOT\n", 1)[0]
          compile(root_code, "<PYROOT>", "exec")

          app_marker = "cat > \"$USER_APP_DIR/uwuntu_image_manager.py\" <<'PYAPP'\n"
          app_code = text.split(app_marker, 1)[1].split("\nPYAPP\n", 1)[0]
          compile(app_code, "<PYAPP>", "exec")

          tree = ast.parse(root_code)
          classifier = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef)
              and node.name == "classify_uwuntu_benchmark"
          )
          module = ast.Module(body=[classifier], type_ignores=[])
          ast.fix_missing_locations(module)
          ns = {}
          exec(compile(module, "<classifier>", "exec"), ns)
          classify = ns["classify_uwuntu_benchmark"]

          cases = [
              (413, "SEHR GUT"),
              (300, "SEHR GUT"),
              (299.9, "GUT"),
              (100, "GUT"),
              (99.9, "NUTZBAR"),
              (30, "NUTZBAR"),
              (29.9, "LANGSAM"),
              (10, "LANGSAM"),
              (9.9, "UNGEEIGNET"),
              (1, "UNGEEIGNET"),
          ]
          for iops, expected in cases:
              actual = classify(iops)["label"]
              assert actual == expected, (iops, actual, expected)

          assert "UWUNTU-EIGNUNG" in root_code
          assert "≥300 IOPS sehr gut" in root_code
          assert 'uwuntu_rating=uwuntu_rating["label"]' in root_code
          print("IM v1.25 Tests OK")
          PY
